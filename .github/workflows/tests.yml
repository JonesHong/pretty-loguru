name: tests

on:
  push:
  pull_request:

jobs:
  pytest-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
        loguru-version: ["0.6.0", "0.7.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install "loguru==${{ matrix.loguru-version }}"
          python -m pip install -e .
          python -m pip install pytest
      - name: Run tests
        run: pytest -q

  uv-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
      - name: Validate lock
        run: uv lock --check
      - name: Sync
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest -q
